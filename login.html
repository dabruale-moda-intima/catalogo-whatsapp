<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DABRUALE - Acesso Administrativo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            padding: 20px;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fce4ec,
                    #f8bbd0
                );

        }


        .login {

            width: 100%;
            max-width: 400px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.15);

        }


        h1 {

            text-align: center;

            margin-top: 0;

            color: #c2185b;

        }


        h2 {

            text-align: center;

            font-size: 20px;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }


        button {

            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #e91e63,
                    #c2185b
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.9;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        #mensagem {

            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;

        }


        .voltar {

            background: #666;

        }

    </style>

</head>


<body>


<div class="login">

    <h1>💗 DABRUALE</h1>

    <h2>🔐 Área Administrativa</h2>


    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        placeholder="Digite seu e-mail"
        autocomplete="email"
    >


    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
        autocomplete="current-password"
    >


    <button
        type="button"
        id="botao-login"
    >
        🔐 Entrar
    </button>


    <div id="mensagem"></div>


    <button
        type="button"
        class="voltar"
        onclick="window.location.href='index.html'"
    >
        🛍️ Voltar para a Loja
    </button>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// =====================================================
// FIREBASE
// =====================================================

const firebaseConfig = {

    // ⚠️ MANTENHA SUA API KEY ORIGINAL
    apiKey: "AIzaSyCtNeIuSYRRP8xSgfda0KXHpuZwNtLrN7g",

    authDomain: "dabruale-moda-intima.firebaseapp.com",

    databaseURL:
        "https://dabruale-moda-intima-default-rtdb.firebaseio.com",

    projectId:
        "dabruale-moda-intima",

    storageBucket:
        "dabruale-moda-intima.firebasestorage.app",

    messagingSenderId:
        "106483648309",

    appId:
        "1:106483648309:web:a1e116f7a2e43d653a2e7c"
};
const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


// =====================================================
// ELEMENTOS
// =====================================================

const email =
    document.getElementById("email");


const senha =
    document.getElementById("senha");


const botao =
    document.getElementById("botao-login");


const mensagem =
    document.getElementById("mensagem");


// =====================================================
// LOGIN
// =====================================================

botao.addEventListener(
    "click",
    async function() {

        const emailDigitado =
            email.value.trim();


        const senhaDigitada =
            senha.value;


        if (!emailDigitado) {

            mostrarMensagem(
                "Digite seu e-mail.",
                "erro"
            );

            email.focus();

            return;

        }


        if (!senhaDigitada) {

            mostrarMensagem(
                "Digite sua senha.",
                "erro"
            );

            senha.focus();

            return;

        }


        botao.disabled = true;

        botao.textContent =
            "⏳ Entrando...";


        try {

            await signInWithEmailAndPassword(
                auth,
                emailDigitado,
                senhaDigitada
            );


            mostrarMensagem(
                "✅ Login realizado! Abrindo cadastro...",
                "sucesso"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "cadastro.html";

                },
                800
            );

        }

        catch (erro) {

            console.error(
                "Erro no login:",
                erro
            );


            mostrarMensagem(
                "❌ E-mail ou senha incorretos.",
                "erro"
            );

        }


        finally {

            botao.disabled = false;

            botao.textContent =
                "🔐 Entrar";

        }

    }
);


// =====================================================
// MENSAGEM
// =====================================================

function mostrarMensagem(
    texto,
    tipo
) {

    mensagem.style.display =
        "block";


    mensagem.textContent =
        texto;


    if (
        tipo === "sucesso"
    ) {

        mensagem.style.background =
            "#d4edda";

        mensagem.style.color =
            "#155724";

    }

    else {

        mensagem.style.background =
            "#ffdddd";

        mensagem.style.color =
            "#900";

    }

}

</script>


</body>

</html>
